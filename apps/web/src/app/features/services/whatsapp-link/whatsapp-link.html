@if (url(); as link) {
  <a class="wa-button" [href]="link" target="_blank" rel="noopener noreferrer">
    <svg class="wa-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.6A.5.5 0 0 1 5 19.2V16h0A2.5 2.5 0 0 1 4 13.5z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linejoin="round"
      />
    </svg>
    <span>Contactar por WhatsApp</span>
  </a>
  <p class="wa-hint">Se abrirá WhatsApp en una pestaña nueva.</p>
} @else {
  <p class="wa-empty" role="status">
    No es posible redirigir a WhatsApp: no hay un número registrado.
  </p>
}
